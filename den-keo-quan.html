<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đèn kéo quân 3D</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #172554, #312e81);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            color: #facc15;
            margin-top: 35px;
        }

        p {
            margin-top: 15px;
        }

        .scene {
            width: 220px;
            height: 280px;
            margin: 140px auto 100px;
            perspective: 1000px;
        }

        .lantern {
            width: 220px;
            height: 280px;
            position: relative;
            transform-style: preserve-3d;

            animation: xoayDen 10s linear infinite;
        }

        .face {
            position: absolute;
            width: 220px;
            height: 280px;
            top: 0;
            left: 0;
            border: 4px solid gold;
            border-radius: 10px;
            overflow: hidden;
            backface-visibility: hidden;
        }

        .face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .face1 { transform: rotateY(0deg) translateZ(190px); }
        .face2 { transform: rotateY(60deg) translateZ(190px); }
        .face3 { transform: rotateY(120deg) translateZ(190px); }
        .face4 { transform: rotateY(180deg) translateZ(190px); }
        .face5 { transform: rotateY(240deg) translateZ(190px); }
        .face6 { transform: rotateY(300deg) translateZ(190px); }

        @keyframes xoayDen {
            from {
                transform: rotateY(0deg);
            }
            to {
                transform: rotateY(360deg);
            }
        }

        .back {
            display: inline-block;
            color: white;
            background: #2563eb;
            padding: 12px 22px;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>ĐÈN KÉO QUÂN 3D</h1>
    <p>Rê chuột vào đèn để tạm dừng xoay</p>

    <div class="scene">
        <div class="lantern" id="lantern">

            <div class="face face1">
                <img src="./images/anh1.jpg" alt="Ảnh 1">
            </div>

            <div class="face face2">
                <img src="./images/anh2.jpg" alt="Ảnh 2">
            </div>

            <div class="face face3">
                <img src="./images/anh3.jpg" alt="Ảnh 3">
            </div>

            <div class="face face4">
                <img src="./images/anh4.jpg" alt="Ảnh 4">
            </div>

            <div class="face face5"><img src="./images/anh5.jpg" alt="Ảnh 5">
            </div>

            <div class="face face6">
                <img src="./images/anh6.jpg" alt="Ảnh 6">
            </div>

        </div>
    </div>

    <a class="back" href="./index.html">Quay lại trang chủ</a>

    <script>
        const lantern = document.getElementById("lantern");

        lantern.addEventListener("mouseenter", function() {
            lantern.style.animationPlayState = "paused";
        });

        lantern.addEventListener("mouseleave", function() {
            lantern.style.animationPlayState = "running";
        });
    </script>

</body>
</html>
